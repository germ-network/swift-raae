name: CI

on:
  push:
    # branches:
    #   - main
    paths-ignore:
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - '.editorconfig'
      - '.spi.yml'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Swift Format
    runs-on: macOS-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app
    steps:
      - uses: actions/checkout@v5
      - name: swift format lint
        run: swift format lint --recursive --configuration .swift-format --strict Sources Tests

  test:
    name: Test MacOS
    runs-on: macOS-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app
    strategy:
      matrix:
        destination:
          - "platform=macOS"
          - "platform=iOS Simulator,name=iPhone 17e"
    steps:
      - uses: actions/checkout@v5
      - name: Test platform ${{ matrix.destination }}
        run: set -o pipefail && xcodebuild -skipMacroValidation -scheme swift-raae-Package -destination "${{ matrix.destination }}" test | xcbeautify

  linux:
    name: Test Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 6.2 is the floor the package's tools-version requires; a 6.1 toolchain cannot
    # even parse the manifest. This job is also the only CI coverage of the span
    # fast path (the gate is true unconditionally on non-CryptoKit platforms),
    # while the macOS jobs below build against Xcode 26.2, whose CryptoKit has no
    # span surface — they cover the array path.
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        run: swift test
