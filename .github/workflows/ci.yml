name: CI

on:
  push:
    # branches:
    #   - main
    paths-ignore:
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - '.editorconfig'
      - '.spi.yml'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Swift Format
    runs-on: macOS-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app
    steps:
      - uses: actions/checkout@v5
      - name: swift format lint
        run: swift format lint --recursive --configuration .swift-format --strict Sources Tests

  test:
    name: Test MacOS
    # macOS 27 + Xcode 27 (public preview): this image's CryptoKit has swift-crypto
    # 5.0's span surface, so these jobs compile and *run* the span fast path rather
    # than only the array fallback. The image's default Xcode is 27.0, so no
    # DEVELOPER_DIR override — the OS-27 runtime is what the `#available` branch needs.
    runs-on: xcode-27-arm64
    timeout-minutes: 30
    strategy:
      matrix:
        destination:
          - "platform=macOS"
          - "platform=iOS Simulator,name=iPhone 17e"
    steps:
      - uses: actions/checkout@v5
      - name: Test platform ${{ matrix.destination }}
        run: set -o pipefail && xcodebuild -skipMacroValidation -scheme swift-raae-Package -destination "${{ matrix.destination }}" test | xcbeautify

  linux:
    name: Test Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 6.2 is the floor the package's tools-version requires; a 6.1 toolchain cannot
    # even parse the manifest. This job also covers the span fast path on a
    # non-CryptoKit platform, where the gate is true unconditionally rather than
    # OS-gated. The equivalence suites diff both paths in-process on either job.
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        run: swift test
